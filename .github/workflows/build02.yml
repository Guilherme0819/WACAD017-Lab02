name: Build V2 (Exercicio 02)

on:
  push:
    paths:
      - 'exercicio02/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci                   
      - name: Run Lint
        run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci                    
      - name: Test code
        run: npm run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci                    
      - name: Build code
        run: npm run build
      - name: Deploy code
        run: echo "Simulando Deploy... Sucesso!"