name: Build V2 (Exercicio 02)
on:
  push:
    paths:
      - 'exercicio02/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint

  test:
    needs: lint       # <--- SEM O # (Isso faz esperar o Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Test code
        run: npm run test

  deploy:
    needs: test       # <--- SEM O # (Isso faz esperar o Teste)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Build code
        run: npm run build
      - name: Deploy code
        run: echo "Deploying..."