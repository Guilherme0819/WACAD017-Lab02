name: Simple Local (Ex 01)

on: push  # <--- Mudei aqui: removi o paths para rodar em qualquer mudança

jobs:
  build-node:
    runs-on: ubuntu-latest
    container: node:18
    defaults:
      run:
        working-directory: ./exercicio01
    steps:
      - run: node --version
      - run: npm --version
      - uses: actions/checkout@v3
      - run: npm install
      # Se tiver o moment no seu package.json do ex1, deixe essa linha. Se não, pode tirar.
      - run: npm install --save moment 
      - run: node app.js