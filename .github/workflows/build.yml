name: Simple Local (Ex 01)

on: push

jobs:
  build-node:
    runs-on: ubuntu-latest
    container: node:18
    defaults:
      run:
        working-directory: ./exercicio01
    steps:
      # CORREÇÃO: O Checkout tem que ser o PRIMEIRO!
      - uses: actions/checkout@v3
      
      # Depois que baixou, aí sim rodamos os comandos:
      - run: node --version
      - run: npm --version
      - run: npm install
      # Se tiver o moment no package.json, mantenha essa linha abaixo, senão pode tirar
      - run: npm install --save moment 
      - run: node app.js