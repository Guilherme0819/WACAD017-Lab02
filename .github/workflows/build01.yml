name: Build V1 (Exercicio 02)

on:
  push:
    paths:
      - 'exercicio02/**' # Só dispara se mexer na pasta do exercício 2

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02 # <--- OBRIGATÓRIO: Entra na pasta correta
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci # <--- Usa a instalação limpa (agora que sincronizamos o lockfile)

      - name: Lint
        run: npm run lint # <--- Vai passar porque criamos o .eslintrc.json

      - name: Test code
        run: npm run test

      - name: Build code
        run: npm run build

      - name: Deploy code
        run: echo "Deploying..."