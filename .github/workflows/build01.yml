name: Build V1 (Exercicio 02)

on:
  push:
    paths:
      - 'exercicio02/**' 

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./exercicio02 
    steps:
      - name: Get code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm ci 

      - name: Lint
        run: npm run lint 

      - name: Test code
        run: npm run test

      - name: Build code
        run: npm run build

      - name: Deploy code
        run: echo "Deploying..."